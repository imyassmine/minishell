name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Readline
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build
        run: make

      - name: Test
        run: make test
